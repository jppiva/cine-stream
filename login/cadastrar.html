<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/assets/styles/cadastrar.css">
</head>
<body>
    <main class="login-caixa">
        <section class="forma-lado">
            <div class="forma-dentro">
                <div class="logo">CineStream</div>

                <h1 id="login-titulo">Crie sua conta</h1>
                <p class="login-subtitulo">Preencha os campos abaixo para começar</p>

                <div>
                    <label class="digitar-campo">
                        <span class="digitar-label">Nome Completo</span>
                        <input
                         type="text"
                         name="nome"
                         placeholder="Seu nome completo"
                         required
                         />
                    </label>
                </div>

                <div>
                    <label class="digitar-campo">
                        <span class="digitar-label">Email</span>
                        <input 
                        type="email"
                        name="email"
                        placeholder="seu@email.com"
                        required
                        />
                    </label>
                </div>

                <label class="digitar-campo">
                    <span class="digitar-label">Senha</span>
                    <input
                    type="password"
                    name="senha"
                    placeholder="••••••••"
                    required
                    />
                </label>

                <label class="digitar-campo">
                    <span class="digitar-label">Confirmar Senha</span>
                    <input
                    type="password"
                    name="confirmarSenha"
                    placeholder="••••••••"
                    required
                    />
                </label>

                <button class="botao">
                    <a href="../index.html">Cadastrar</a>
                </button>

                <p class="signup">
                    Já tem uma conta <a href="login.html">Entrar</a>
                </p>
                <div class="img">
                    <img src="https://m.media-amazon.com/images/M/MV5BNzBiODQxZTUtNjc0MC00Yzc1LThmYTMtN2YwYTU3NjgxMmI4XkEyXkFqcGc@._V1_.jpg" alt="" width="350" height="auto">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
