<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../assets/styles/login.css">
</head>
<body>
    <main class="login-caixa">
        <section class="forma-lado">
            <div class="forma-dentro">

                <h1 id="login-titulo">CineStream</h1>
                <p class="login-subtitulo">O seu universo de cinema e series em um só clique.</p>

                <div>
                    <label class="digitar-campo">
                        <span class="digitar-label">Email</span>
                        <input type="email" email="Email" placeholder="seu@email.com" required>
                    </label>
                </div>

                <label class="digitar-campo">
                    <span class="digitar-label">Senha</span>
                    <input type="password" pass="Senha" placeholder="••••••••" required/>
                </label>

                <div class="forma-row">
                    </div>
                    <a class="esqueci-senha" href="#">Esqueceu a senha?</a>
                </div>

                <button class="botao">
                    <a href="../index.html">Entrar</a>
                </button>
                    <div class="singup">Não tem conta?
                        <a href="/pages/cadastrar.html">Cadastre-se</a>
                    </div>
                <div class="img">
                    <img src="https://play-lh.googleusercontent.com/YHcQof1MGYd2zagX1fRR15AqoeX_bjPt2z8wDwSn83pNsvhbft2gQikYJ6TTHWZ0oZzpfAqhKvDWtrsWk74" alt="" width="315" height="auto">
                </div>
            </div>
        </section>
    </main>
</body>
</html>
