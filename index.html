<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cine stream</title>
    <link rel="stylesheet" href="assets/styles/index.css" />
  </head>
  <body>
    <div class="box">
      <nav class="nav">
        <div class="logo">CineStream</div>

        <div class="menu">
          <div>
            <a class="color" href="index.html">Home</a>
          </div>

          <div class="login">
            <a class="button" href="login/login.html">Login</a>
          </div>
        </div>
      </nav>
    </div>

    <header class="hero">
      <img src="assets/images/perfect-blue.svg" alt="Poster do filme em destaque" class="hero-poster" />
      <div class="hero-overlay">
        <div class="hero-info">
          <h1>Perfect Blue</h1>
          <p>Filme em destaque. Clique em play para assistir.</p>
          <a href="#" class="play-btn" >Assistir</a>
        </div>
      </div>
    </header>

    <main class="movies-section">
      <h2>Recomendados</h2>
      <div class="movies-grid">
        <article class="card" data-video="assets/videos/sample.mp4">
          <img src="assets/images/toy-story.svg" alt="Toy Story" />
          <h3>Toy Story</h3>
        </article>

        <article class="card" data-video="assets/videos/sample.mp4">
          <img src="assets/images/the-vampire-diaries.svg" alt="The Vampire Diaries" />
          <h3>The Vampire Diaries</h3>
        </article>

      </div>
    </main>
  </body>
</html>
